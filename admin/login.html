<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <meta name="robots" content="noindex" />
    <title>Admin Gateway — Tesla Capital</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700&display=swap" rel="stylesheet" />

    <!-- Tailwind -->
    <link rel="stylesheet" href="/dist/tailwind.css" />

    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

    <style>
      .page-auth {
        background:
          radial-gradient(1200px 600px at 10% -10%, #0f1f38 0%, #0000 55%),
          radial-gradient(900px 500px at 90% 110%, #0d1b2e 0%, #0000 55%),
          #070d1a;
      }
      .auth-glow {
        position: relative;
      }
      .auth-glow::before {
        content: '';
        position: absolute;
        inset: -40px;
        background:
          radial-gradient(1200px 500px at 10% 0%, rgba(232, 33, 39, 0.35) 0%, #0000 45%),
          radial-gradient(900px 500px at 90% 100%, rgba(30, 60, 220, 0.35) 0%, #0000 45%),
          radial-gradient(700px 400px at 50% 50%, rgba(255, 160, 80, 0.18) 0%, #0000 50%);
        filter: blur(40px);
        opacity: 0.85;
        z-index: 0;
        pointer-events: none;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .hairline {
        border: 1px solid rgba(0, 0, 0, 0.12);
      }
    </style>
  </head>
  <body class="page-auth text-slate-900 dark:text-slate-100 font-sans antialiased">
    <div class="flex min-h-screen flex-col">
      <!-- Dark header -->
      <header class="border-b border-white/10 bg-black/90 backdrop-blur-xl">
        <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
          <div class="flex h-16 items-center justify-between">
            <a href="/pages/index.html" class="flex items-center gap-3">
              <img src="/assets/tesla-logo.svg" alt="Tesla Capital" class="h-7 w-auto invert" />
              <span class="text-sm font-semibold tracking-tight text-white">Tesla Capital</span>
            </a>
            <a href="/pages/login.html" class="text-xs font-medium text-slate-300 transition hover:text-white">User Sign In</a>
          </div>
        </div>
      </header>

      <!-- Main -->
      <main class="flex flex-1 items-center justify-center px-4 py-10">
        <div class="w-full max-w-sm auth-glow">
          <div class="relative z-10 glass-card hairline rounded-2xl p-6 shadow-2xl">
            <div class="mb-6 text-center">
              <h1 class="text-xl font-bold tracking-tight text-black">Admin Gateway</h1>
              <p class="mt-1 text-xs text-slate-500">Restricted access. Use your admin password.</p>
            </div>

            <div id="login-error" class="hidden mb-4 rounded-lg border border-red-500/30 bg-red-500/10 px-3 py-2 text-xs text-red-700"></div>

            <form id="login-form" class="space-y-4" novalidate>
              <div>
                <label for="login-password" class="mb-1 block text-xs font-medium text-slate-700">Admin Password</label>
                <input
                  type="password"
                  id="login-password"
                  name="password"
                  required
                  autocomplete="current-password"
                  placeholder="••••••••"
                  class="w-full rounded-xl border border-black/15 bg-white px-3 py-2.5 text-sm text-black placeholder:text-slate-400 outline-none transition focus:border-black focus:ring-2 focus:ring-black/20"
                />
              </div>

              <button
                type="submit"
                id="login-submit"
                class="w-full rounded-xl bg-black px-4 py-2.5 text-sm font-semibold text-white shadow-lg transition hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-black/40 focus:ring-offset-2 focus:ring-offset-white"
              >
                Authenticate
              </button>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <script>
      lucide.createIcons();

      var form = document.getElementById('login-form');
      var errorEl = document.getElementById('login-error');
      var submit = document.getElementById('login-submit');

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.remove('hidden');
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        errorEl.classList.add('hidden');
        submit.disabled = true;
        submit.textContent = 'Authenticating…';

        fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: document.getElementById('login-password').value,
          }),
        })
          .then(function (res) {
            return res.json().catch(function () {
              return { error: 'The server returned an unexpected response. Please try again.' };
            });
          })
          .then(function (data) {
            if (data.blocked) {
              showError('Your admin access has been restricted. Please contact support.');
              submit.disabled = false;
              submit.textContent = 'Authenticate';
              return;
            }
            if (data.user && data.user.role === 'admin') {
              window.location.href = '/admin/';
              return;
            }
            showError(data.error || 'Invalid admin password.');
            submit.disabled = false;
            submit.textContent = 'Authenticate';
          })
          .catch(function () {
            showError('Network error. Please try again.');
            submit.disabled = false;
            submit.textContent = 'Authenticate';
          });
      });
    </script>
  <footer class="mt-12 border-t border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <img src="/assets/tesla-t.svg" alt="Tesla icon by Icon 54" class="w-16 h-16 md:w-20 md:h-20" />
        <div class="text-sm md:text-base text-gray-700 dark:text-gray-300">
          <a href="https://iconscout.com/icons/tesla" class="text-underline font-size-sm" target="_blank" rel="noopener">Tesla</a> by <a href="https://iconscout.com/contributors/icon-54" class="text-underline font-size-sm" target="_blank" rel="noopener">Icon 54</a> on <a href="https://iconscout.com" class="text-underline font-size-sm" target="_blank" rel="noopener">IconScout</a>
        </div>
      </div>
    </div>
  </footer>
  <footer class="mt-12 border-t border-gray-200 dark:border-gray-800 bg-white/80 dark:bg-gray-900/80 backdrop-blur">
    <div class="max-w-7xl mx-auto px-4 py-10 flex flex-col items-center justify-center gap-6">
      <div class="flex items-center justify-center gap-5 flex-wrap">
        <a href="https://iconscout.com/icons/tesla" target="_blank" rel="noopener" class="group flex flex-col items-center gap-2">
          <img src="/assets/tesla-icon.svg" alt="Tesla" class="w-20 h-20 md:w-28 md:h-28 group-hover:scale-110 transition-transform duration-200" />
        </a>
        <span class="text-3xl font-light text-gray-500 select-none">×</span>
        <a href="https://iconscout.com/contributors/icon-54" target="_blank" rel="noopener" class="group flex flex-col items-center gap-2">
          <img src="/assets/iconscout-logo.svg" alt="Icon 54" class="w-20 h-20 md:w-28 md:h-28 group-hover:scale-110 transition-transform duration-200" />
        </a>
        <span class="text-3xl font-light text-gray-500 select-none">×</span>
        <a href="https://iconscout.com" target="_blank" rel="noopener" class="group flex flex-col items-center gap-2">
          <img src="/assets/iconscout-logo.svg" alt="IconScout" class="w-20 h-20 md:w-28 md:h-28 group-hover:scale-110 transition-transform duration-200" />
        </a>
      </div>
      <p class="text-sm text-gray-600 dark:text-gray-400">Icons by <a href="https://iconscout.com/contributors/icon-54" class="underline" target="_blank" rel="noopener">Icon 54</a> on <a href="https://iconscout.com" class="underline" target="_blank" rel="noopener">IconScout</a></p>
    </div>
  </footer>
  </body>
</html>
