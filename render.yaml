# Render Blueprint — Tesla XTeam FX Trade
# Upload this folder (new-website/) as the repository root, or point Render
# at a Git repo whose root is this folder. Render reads this file on deploy.
#
# DATABASE (Neon): storage is a Neon Postgres database. Create it from the
# Render dashboard (New + -> PostgreSQL -> Neon), then paste the POOLED
# connection string into the service's DATABASE_URL env var (see below).
# With DATABASE_URL set the app stores everything in Postgres, so no
# persistent disk is needed and data survives redeploys and free-tier
# sleeps automatically.
services:
  - type: web
    name: xteam-fx-trade
    runtime: node
    rootDir: .
    buildCommand: ""
    startCommand: npm start
    healthCheckPath: /api/settings
    envVars:
      - key: NODE_ENV
        value: production
      # Render serves HTTPS; this makes the session cookie Secure.
      - key: HTTPS
        value: "true"
      # Admin console password (password-only login). Change before deploying
      # if you don't want the default.
      - key: ADMIN_PASSWORD
        value: biggod
      # Neon Postgres connection string — SECRET, set manually.
      # sync: false tells Render to keep the value you paste in the dashboard
      # instead of resetting it. Without DATABASE_URL the app falls back to
      # local JSON files on Render's EPHEMERAL disk (data resets on deploy).
      - key: DATABASE_URL
        sync: false
